[settings]
experimental = true

[deps.pnpm]
auto = true
run = "pnpm install --frozen-lockfile --prefer-offline"

[tools]
node = "24.22.1"
pnpm = "12.15.0"

[env]
_.path = ["./node_modules/.bin"]

[tasks.setup]
shell = "bash -c"
run = '''
set -e
mise install
mise deps
mise generate git-pre-commit --write --task check
mise generate git-pre-commit --write --hook post-checkout --task setup
'''

[tasks.dev]
run = "nuxt dev"

[tasks.build]
run = "nuxt generate"

[tasks.start]
run = "node scripts/start.mjs"

[tasks.format]
run = "prettier . --write"

[tasks."nuxt:prepare"]
run = "nuxt prepare"

[tasks.typecheck]
depends = ["nuxt:prepare"]
run = "vue-tsc -b --noEmit"

[tasks.lint]
depends = ["nuxt:prepare"]
run = "eslint . --max-warnings 0"

[tasks.test]
wait_for = ["nuxt:prepare"]
run = "vitest run"

[tasks."check:format"]
run = "prettier . --check"

[tasks."check:knip"]
depends = ["nuxt:prepare"]
run = "knip"

[tasks.check]
depends = ["nuxt:prepare", "typecheck", "lint", "test", "check:format", "check:knip"]
